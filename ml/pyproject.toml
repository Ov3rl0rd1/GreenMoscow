[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "greenplan-ml"
version = "0.1.0"
description = "Heatmap model that proposes planting spots for the GreenPlan engine"
requires-python = ">=3.11"
dependencies = [
  "greenplan",
  "torch>=2.4",
  "numpy>=1.26",
  "onnx>=1.16",
  "onnxruntime>=1.17",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6", "ruff>=0.4"]

[project.scripts]
greenplan-ml = "greenplan_ml.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
  "realdata: requires the extracted pilot dataset under data/pilot",
  "slow: long running tests",
  "gpu: requires a CUDA device",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["greenplan", "greenplan_ml"]
known-local-folder = ["fixtures", "conftest"]
