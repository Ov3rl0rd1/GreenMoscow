services:
  engine:
    build:
      context: .
      dockerfile: engine/Dockerfile
    image: greenplan-engine:local
    ports:
      - "8000:8000"
    volumes:
      - greenplan-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz').read()
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: greenplan-web:local
    environment:
      Engine__BaseUrl: http://engine:8000/
    ports:
      - "8080:8080"
    depends_on:
      engine:
        condition: service_healthy
    restart: unless-stopped

volumes:
  greenplan-data:
