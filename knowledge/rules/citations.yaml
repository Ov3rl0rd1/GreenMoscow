  - key: sp42_t9_1_note3
    doc_short: "СП 42.13330.2016"
    locator: "примечание 3 к таблице 9.1"
    quote_ru: "Деревья, высаживаемые у зданий, не должны препятствовать инсоляции и освещенности жилых и общественных помещений с учетом раздела 14."
    verification: verified

  - key: sp42_t9_1_note4
    doc_short: "СП 42.13330.2016"
    locator: "примечание 4 к таблице 9.1 (введено Изм. № 2)"
    quote_ru: "Расстояние от инженерных сетей, а также отступ от бордюра, примыкающего к проезжей части улиц и дорог до кадки с растениями или защитных прикорневых барьеров, следует принимать не менее 500 мм."
    verification: verified

  - key: sp42_t9_1_note5
    doc_short: "СП 42.13330.2016"
    locator: "примечание 5 к таблице 9.1 (введено Изм. № 2)"
    quote_ru: >-
      При устройстве защитных прикорневых барьеров (не более чем с двух сторон от ствола) в зависимости
      от высоты кроны деревьев их высадка может проводиться на расстоянии от инженерных сетей и бордюров
      улиц и дорог, м, не менее: 0,5 - для деревьев с высотой кроны менее 5 м; 1 - для деревьев с высотой
      кроны от 5 до 20 м. Для деревьев с высотой кроны менее 5 м допускается устройство прикорневых барьеров
      с четырех сторон от ствола, без ограничения роста их корней вглубь. Расстояние от инженерных сетей до
      дерева (кустарника) измеряется как расстояние между наружными поверхностями их стволов и трубы
      инженерной сети (либо защитного футляра (обоймы)).
    verification: verified

  - key: sp42_t9_1_note6
    doc_short: "СП 42.13330.2016"
    locator: "примечание 6 к таблице 9.1 (введено Изм. № 2)"
    quote_ru: "Защитные прикорневые барьеры должны конструктивно обеспечивать перенаправление роста корней в безопасном для инженерных сетей направлении, выполняться из материала, безопасного для корней, не содержащего токсичных веществ, исключающего загрязнение почвы."
    verification: verified

  - key: sp42_t9_1_note7
    doc_short: "СП 42.13330.2016"
    locator: "примечание 7 к таблице 9.1 (введено Изм. № 2, в ред. Изм. № 3)"
    quote_ru: >-
      При посадке деревьев вдоль тротуаров, улиц и дорог, обочин, канав, откосов, террас, подпорных стенок
      и т.п. допускается уменьшение расстояния до ствола деревьев при условии разработки мероприятий
      (прокладка инженерных коммуникаций закрытым способом, устройство защитных прикорневых барьеров,
      защита корней от продавливания уплотнением почвы, подача питания и полива непосредственно к корням).
    verification: verified

  - key: sp42_p11_16
    doc_short: "СП 42.13330.2016"
    locator: "п. 11.16 (в ред. Изм. № 3)"
    quote_ru: >-
      На нерегулируемых перекрестках и примыканиях улиц и дорог, а также на пешеходных переходах необходимо
      предусматривать треугольники видимости. Размеры сторон треугольника для условий "транспорт-транспорт"
      и для условий "пешеход-транспорт" должны быть определены по расчету согласно СП 396.1325800.
      В пределах треугольников видимости не допускается размещение зданий, сооружений, передвижных предметов
      (киосков, фургонов, реклам, малых архитектурных форм и др.), деревьев и кустарников высотой более 0,5 м.
    verification: verified
    note: "Методика расчёта размеров — СП 396.1325800 (текст не выгружался)."

  - key: sp42_p12_35_t12_5
    doc_short: "СП 42.13330.2016"
    locator: "п. 12.35, таблица 12.5 (в ред. Изм. № 3)"
    quote_ru: "Расстояния по горизонтали (в свету) от ближайших подземных инженерных сетей до зданий и сооружений следует принимать по таблице 12.5."
    verification: verified
    note: "Используется для валидации подосновы, не для посадок. В ред. Изм. № 3 добавлена строка «ЛКС ТМК» (0,5 м)."

  - key: sp42_p12_36_t12_6
    doc_short: "СП 42.13330.2016"
    locator: "п. 12.36, таблица 12.6"
    quote_ru: "Расстояния по горизонтали (в свету) между соседними инженерными подземными сетями при их параллельном размещении принимаются по таблице 12.6"
    verification: verified

