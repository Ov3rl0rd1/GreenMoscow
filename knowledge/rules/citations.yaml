  - key: ppm743_p3_6_3_t3_6_1
    doc_full: "Постановление Правительства Москвы от 10.09.2002 № 743-ПП «Об утверждении Правил создания, содержания и охраны зеленых насаждений и природных сообществ города Москвы», приложение 1 (Правила)"
    doc_short: "743-ПП"
    locator: "п. 3.6.3, таблица 3.6.1 «Расстояние от сооружений до посадок растений (МГСН 1.01.99)»"
    quote_ru: >-
      Деревья и кустарники следует высаживать в соответствии с существующими в строительстве правилами и
      нормами, регламентируются расстояния от стен здания и различных сооружений до места посадки растений
      (МГСН 1.01-99). Таблица 3.6.1: Наружная стена здания и сооружения 5,0/1,5; Наружная стена школьного
      здания или здания детского сада 10,0/1,5; Ось трамвайных путей 5,0/3,0; Край тротуара и садовой
      дорожки 0,7/0,5; Край проезжей части улиц, кромка укрепленной полосы обочины дороги и бровка канавы
      2,0/1,0; Мачта и опора осветительной сети, трамвая, колонны галерей и эстакад 4,0/-; Подошва откоса,
      террасы и др. 1,0/0,5; Подошва и внутренняя грань подпорных стенок 3,0/1,0; Подземные коммуникации:
      газопровод, канализация 1,5/-; теплопровод, трубопровод, теплосеть 2,0/1,0; водопровод, дренаж 2,0/-;
      силовой кабель и кабель связи 2,0/0,7 (минимальное расстояние до оси растения, м: дерева/кустарника).
    url: "https://base.garant.ru/378956/53f89421bbdaf741eb2d1ecc4ddb4c33/"
    local_text: "research/norms-texts/PPM_743-PP_Pravila_prilozhenie1.txt"
    verification: verified
    note: >-
      Строка «теплопровод, трубопровод, теплосеть — 2,0» — наиболее вероятный источник формулировки ТЗ
      «не менее 2 метров от трубопроводов». 369-ПП (2026) меняет в 743-ПП только п. 8.6 приложения 1
      (вырубка инвазивных растений) и таблиц 3.6.1–3.6.2 не касается.

