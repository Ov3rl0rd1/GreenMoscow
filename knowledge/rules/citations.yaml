  - key: ppm743_t3_6_1_note3
    doc_short: "743-ПП"
    locator: "примечание 3 к таблице 3.6.1"
    quote_ru: "Деревья с широкой кроной (липа, клен, дуб, каштан, тополь и др.), затеняющие жилые помещения, должны сажаться не ближе 10 м от здания (Методические указания по осуществлению государственного санитарного надзора за устройством и содержанием зданий, утвержденные 24.02.1981 N 2295-81)."
    verification: verified

  - key: ppm743_p3_6_4_t3_6_2
    doc_short: "743-ПП"
    locator: "п. 3.6.4, таблица 3.6.2 «Ориентировочные расстояния между деревьями и кустарниками на магистралях»"
    quote_ru: >-
      Расстояния между деревьями и кустарниками, высаживаемыми вдоль магистралей, определяются проектом в
      соответствии с табл. 3.6.2. Таблица 3.6.2: с однорядной посадкой деревьев 5-6; с двухрядной посадкой
      деревьев 7-8; с однорядной посадкой кустарников: высоких (более 1,8 м) 0,5-1, средних и низких 0,3-0,4;
      с групповой посадкой: деревьев 5-7, кустарников 0,3. Примечание. При многорядной посадке кустарников
      ширину полосы следует увеличивать на 1,5-2 м для каждого дополнительного ряда растений.
    verification: verified
    note: "Таблицы 3.6.1 и 3.6.2 дополнительно сверены 29.09.2026 по редакции 743-ПП с изменениями до постановления от 04.02.2025 № 133-ПП; более поздние изменения (08.08.2025 № 1930-ПП, 24.09.2025 № 2339-ПП, 26.12.2025 № 3375-ПП) по этим таблицам не сверены."

  - key: ppm743_p3_3_1_t3_3_1
    doc_short: "743-ПП"
    locator: "п. 3.3.1, таблица 3.3.1 «Стандартные размеры комов, ям и траншей для посадки деревьев и кустарников»"
    quote_ru: >-
      Деревья и кустарники с комом земли круглым: ком d=0,5 h=0,4 — яма d=1 h=0,65; ком d=0,8 h=0,6 — яма
      d=1,3 h=0,85; ком d=1,2 h=0,8 — яма d=1,7 h=1,15; ком d=1,6 h=0,8 — яма d=2,1 h=1,15. Деревья
      лиственные без кома — яма d=0,7 h=0,7 (с почвогрунтом d=1,0 h=0,8); кустарники без кома — d=0,5 h=0,5
      (с растительной землёй d=0,7 h=0,5); однорядная живая изгородь — траншея 0,6x0,5, двухрядная — 0,7x0,5.
    verification: verified

