# Русские термины для текстов объяснений посадок и отказов.
# Тексты собираются шаблонами движка из структуры решения; здесь — только слова,
# без чисел и без номеров пунктов НПА (номера берутся из citations.yaml по политике сверки).

meta:
  version: "0.1.0"
  updated: "2026-09-15"

targets:
