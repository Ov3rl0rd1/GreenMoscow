site_violations:
  outside_plantable_surface:
    text: "точка вне озеленяемой поверхности (газона)"
  outside_site_boundary:
    text: "точка вне границы работ"
  too_close_to_existing_tree:
    text: "расстояние до сохраняемого дерева меньше проектного минимума"
    source_refs: [design_assumption]
  too_close_to_planned_plant:
    text: "расстояние до другой проектной посадки меньше проектного минимума"
    source_refs: [design_assumption]
  no_suitable_species:
    text: "ни одна порода ассортимента не проходит нормы и правила подбора в этой точке"

site_warnings:
  planting_area_not_found: >-
    на чертежах не найдены ни граница работ, ни газоны — места для посадок не определены, поэтому
    посадки не размещены; приложите генплан с границей работ и проектными газонами
  networks_not_found: >-
    подземные коммуникации во входных чертежах не найдены — отступы от сетей не проверялись;
    приложите геоподоснову с сетями, иначе план нельзя считать согласуемым
  buildings_not_found: >-
    здания на чертеже не найдены — отступы от наружных стен не проверены; сверьте участок с
    актуальной застройкой (на генплане здания нанесены не всегда)
  protected_areas_not_checked: >-
    попадание участка в особо охраняемые природные территории и природные зоны не проверялось —
    во входных чертежах нет их границ

invasive:
  allowed:
    text: "вид не входит в известные перечни инвазивных растений"
    source_refs: [ppm369_invasive, mpr77_invasive]
  allowed_with_control:
    text: "вид разрешён на всех территориях, кроме ООЗТ и ПТ, при контроле распространения — примечание [1] к таблице ассортимента"
    source_refs: [dpioos_assortment_notes]
  conditional:
    text: "условно допустимо: источники по перечню инвазивных растений расходятся, требуется проверка"
  excluded:
    text: "вид входит в перечень инвазивных растений"

