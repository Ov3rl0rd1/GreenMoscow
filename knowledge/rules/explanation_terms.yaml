    text: "ни одна порода ассортимента не проходит нормы и правила подбора в этой точке"

composition:
  elements:
    row:
      name: "рядовая посадка"
      purpose: >-
        задаёт ритм улицы и направление движения, отделяет пешеходов от проезжей части,
        задерживает пыль и шум, затеняет тротуар
    group:
      name: "группа деревьев"
      purpose: >-
        объёмный акцент на газоне и тень для отдыха; деревья в группе устойчивее к ветру и
        защищают друг друга
    solitary:
      name: "солитёр"
      purpose: >-
        одиночный акцент, газон вокруг остаётся открытым для обзора и использования
    hedge:
      name: "живая изгородь"
      purpose: >-
        отделяет газон и тротуар от проезжей части, задерживает пыль у земли и направляет пешеходов
    shrub_group:
      name: "куртина кустарника"
      purpose: >-
        декоративное пятно на газоне или у группы деревьев, укрывает почву и поддерживает
        насекомых-опылителей
  edges:
    carriageway_edge: "вдоль проезжей части"
    sidewalk_edge: "вдоль тротуара"
    lawn_edge: "вдоль дорожки или края газона"
  companion:
    name: "при рядовой посадке деревьев"
    purpose: >-
      вместе с рядом деревьев образует аллею с живой изгородью: кроны дают тень, изгородь у земли
      закрывает газон и тротуар от пыли, брызг и реагентов с проезжей части
  source_note: "назначение элемента — обоснование проектного решения, а не норма"

design_agents:
  note: >-
    дизайнер ставит основу плана, аналитик улицы и критик композиции находят проблемы, которые
    закрываются посадкой, координатор закрывает их из резерва бюджета; каждое решение проверено нормами
  problems:
    unsheltered_front: {name: "фронт проезжей части без защитной посадки", unit: "м"}
    unshaded_sidewalk: {name: "тротуар без тени", unit: "м"}
    empty_lawn: {name: "пустой участок газона", unit: "м²"}
    bare_tree_group: {name: "группа деревьев без кустарника", unit: "м²"}

density:
  exceeded: >-
    по решению пользователя превышен рекомендательный норматив плотности ТСН 30-307
    (табл. В.1): {detail}; количество задано по проектной практике датасета, обязательные
    отступы соблюдены — превышение нужно обосновать при согласовании
  trees: "деревьев {count} при нормативе {limit}"
  shrubs: "кустарников {count} при нормативе {limit}"
  tree_floor: >-
    модель ожидала около {expected} деревьев — слишком мало для улицы, где по нормативу допустимо
    до {limit}; цель поднята до {planned}, чтобы вдоль улицы были тень и ритм посадок, как в
    проектах датасета; дополнительные места выбраны по оценке модели и правилам отступов
  tree_floor_shortfall: >-
    нормы и свободный газон участка позволили поставить только {placed}

site_warnings:
  planting_area_not_found: >-
    на чертежах не найдены ни граница работ, ни газоны — места для посадок не определены, поэтому
    посадки не размещены; приложите генплан с границей работ и проектными газонами
  networks_not_found: >-
    подземные коммуникации во входных чертежах не найдены — отступы от сетей не проверялись;
    приложите геоподоснову с сетями, иначе план нельзя считать согласуемым
  buildings_not_found: >-
    здания на чертеже не найдены — отступы от наружных стен не проверены; сверьте участок с
    актуальной застройкой (на генплане здания нанесены не всегда)
  protected_areas_not_checked: >-
    попадание участка в особо охраняемые природные территории и природные зоны не проверялось —
    во входных чертежах нет их границ

invasive:
  allowed:
    text: "вид не входит в перечень инвазивных растений города Москвы и в федеральный перечень"
    source_refs: [ppm369_invasive, mpr77_invasive]
  allowed_with_control:
    text: >-
      вид группы III перечня инвазивных растений: высаживается на всех территориях, кроме особо охраняемых
      зелёных и природных территорий, при мерах против распространения на соседние участки
    source_refs: [ppm369_order_p5_3]
  conditional:
    text: "условно допустимо: сведения о виде в перечне инвазивных растений расходятся, требуется проверка"
  excluded:
    text: "вид входит в перечень инвазивных растений — высадка запрещена"
    source_refs: [ppm369_order_p2_4]

