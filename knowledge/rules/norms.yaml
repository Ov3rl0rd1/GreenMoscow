  - id: carriageway_edge_tree
    obstacle: carriageway_edge
    target: tree
    distance_m: 2.0
    measured_from: edge
    measured_to: trunk_axis
    severity: prohibitive
    source_ref: sp42_t9_1_carriageway

  - id: carriageway_edge_shrub
    obstacle: carriageway_edge
    target: shrub
    distance_m: 1.0
    measured_from: edge
    measured_to: trunk_axis
    severity: prohibitive
    source_ref: sp42_t9_1_carriageway

  - id: tram_track_tree
    obstacle: tram_track_axis
    target: tree
    distance_m: 5.0
    measured_from: axis
    measured_to: trunk_axis
    severity: prohibitive
    source_ref: sp42_t9_1_tram

  - id: tram_track_shrub
    obstacle: tram_track_axis
    target: shrub
