# ---------------------------------------------------------------------------
# ГОРОДСКАЯ СРЕДА: ВИДИМОСТЬ, ПОЖАРНЫЕ ПРОЕЗДЫ, ДОСТУПНОСТЬ
# ---------------------------------------------------------------------------

  - id: sight_triangle
    obstacle: sight_triangle
    target: [tree, shrub]
    rule_type: zone_exclusion
    height_threshold_m: 0.5
    severity: prohibitive
    source_ref: sp42_sight_triangle
    verification: needs_check
    rationale_ru: >-
      В пределах треугольников видимости на нерегулируемых перекрёстках не допускается
      размещение деревьев и кустарников высотой более 0,5 м.
    params:
      sizes_m: [[8, 40], [10, 50]]

  - id: fire_lane_row_planting
    obstacle: fire_lane
    target: tree
    rule_type: zone_exclusion
    applies_to_pattern: row        # запрещена именно РЯДОВАЯ посадка
    severity: prohibitive
    source_ref: sp4_13130_fire_lane
    verification: needs_check
    rationale_ru: >-
      В зоне противопожарного проезда (между проездом и стеной здания) не допускается
      осуществлять рядовую посадку деревьев.

  - id: pedestrian_clear_width
    obstacle: sidewalk
    target: [tree, shrub]
    rule_type: residual_width
    min_clear_width_m: 1.2
    preferred_clear_width_m: 1.8
    severity: prohibitive
    source_ref: sp59_13330_width
    rationale_ru: >-
      После размещения посадки и приствольной лунки ширина свободного пути движения
      должна оставаться не менее 1,2 м (рекомендуется 1,8 м для разъезда).

  - id: pedestrian_clear_height
    obstacle: sidewalk
    target: tree
    rule_type: vertical_clearance
    min_clear_height_m: 2.1
    severity: advisory
    source_ref: sp59_13330_height
    rationale_ru: >-
      Высота свободного пространства над путём движения — не менее 2,1 м;
      нижние ветви не должны свисать ниже этой отметки (обеспечивается формовкой кроны).

  - id: soil_depth_over_underground_structure
    obstacle: underground_structure_roof
    target: tree
    rule_type: soil_depth
    min_soil_depth_m: 0.8
    severity: prohibitive
    source_ref: tsn30_307_soil_depth
    rationale_ru: >-
      Над перекрытиями подземных сооружений посадка дерева возможна только при
      достаточной толщине слоя растительного грунта (для деревьев — от 0,6–0,8 м).

# ---------------------------------------------------------------------------
# ВЗАИМНОЕ РАЗМЕЩЕНИЕ ПОСАДОК (агротехника, не НПА-запрет)
# ---------------------------------------------------------------------------

  - id: tree_to_tree_spacing
    obstacle: existing_or_proposed_tree
    target: tree
    rule_type: mutual_spacing
    distance_m: 5.0
    distance_m_by_crown: "max(5.0, crown_d_a/2 + crown_d_b/2 + 1.0)"
    severity: advisory
    source_ref: agro_practice
    rationale_ru: >-
      Расстояние между деревьями принимается исходя из проектного диаметра крон,
      чтобы исключить конкуренцию за свет и почвенные ресурсы.

  - id: shrub_to_shrub_spacing
    obstacle: existing_or_proposed_shrub
    target: shrub
    rule_type: mutual_spacing
    distance_m: 1.0
    severity: advisory
    source_ref: agro_practice

  - id: invasive_species_ban
    rule_type: assortment_filter
    severity: prohibitive
    source_ref: ppm369_invasive
    rationale_ru: >-
      Виды, включённые в перечень инвазивных растений города Москвы,
      исключаются из подбираемого ассортимента.
