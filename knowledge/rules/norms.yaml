# Машиночитаемая база нормативных ограничений для генератора озеленения.
# Версия 0.2.0 — пересобрана 15.09.2026 по официальным текстам (см. citations.yaml,
# research/norms-texts/). Номера пунктов берутся ТОЛЬКО из citations.yaml.
#
# Единицы — метры, расстояния в плане.
#
# measured_from / measured_to:
#   network_outer_surface → trunk_outer_surface
#       СП 42.13330.2016, прим. 5 к табл. 9.1: «между наружными поверхностями их стволов и трубы
#       инженерной сети (либо защитного футляра (обоймы))». В коде:
#       dist(ось_сети, ось_ствола) >= distance_m + outer_radius_сети + trunk_radius
#   object_edge / outer_wall / object_center → trunk_axis
#       шапка табл. 9.1: «Расстояния, м, от здания, сооружения, объекта до оси ствола дерева / кустарника»
#   zone_from_network_axis / zone_from_structure_edge → trunk_axis
#       границы охранных зон (ПП 160, ПП 878, ПП 578, Приказ 197)
#
# severity:
#   prohibitive       — посадка недопустима (норма СП/МГСН)
#   conditional       — допустима только по письменному согласию/разрешению эксплуатирующей
#                       организации (режим охранных зон)
#   conditional_measure — допустима при выполнении мероприятия (корневой барьер и т.п.)
#   advisory          — рекомендация («не следует», «рекомендуется», ориентировочные значения)
#
# distance_m: null — норма данным источником НЕ УСТАНОВЛЕНА (прочерк), это не ноль и не запрет:
#   посадка возможна (подтверждено постановщиком 16.09.2026).
#
# activation — правило участвует в решении только при включённой настройке:
#   protection_zones — design.apply_protection_zones (по умолчанию выключена: по ответу
#   постановщика 16.09.2026 охранные зоны отдельно не применяются, «отступ является охранной зоной»).
# Итоговое требование = максимум по всем применимым правилам одной severity;
# зона conditional всегда шире или равна зоне prohibitive.

meta:
  version: "0.3.0"
  updated: "2026-09-16"
  conflict_resolution: max_of_applicable_per_severity

  crown_rule:
    # Прим. 1 к табл. 9.1 СП 42 и прим. 1 к табл. 3.6.1 743-ПП: нормы даны для кроны <= 5 м
    # и «должны быть увеличены» для большей кроны. Формулы нормы не дают.
    base_crown_diameter_m: 5.0
    formula: "d_final = d_table + max(0, (crown_d - 5.0) / 2)"
    status: assumption
    source_ref: sp42_t9_1_note1
    assumption_ref: design_assumption

  root_barrier_rule:
    # Прим. 4–7 к табл. 9.1 СП 42: уменьшенные отступы при прикорневых барьерах.
    # Применяется к правилам с root_barrier: true (сети и бордюр проезжей части), только к деревьям.
    # Высота кроны при размещении неизвестна — берётся больший минимум (1 м, крона 5–20 м).
    # Сокращение подтверждено постановщиком 16.09.2026: только с корнезащитой сбоку от сети.
    applies_to: [network, curb]
    max_barrier_sides: 2          # для кроны высотой < 5 м допускается 4 стороны
    min_distance_to_barrier_or_tub_m: 0.5
    by_crown_height:
      - {crown_height_lt_m: 5.0,  min_distance_m: 0.5}
      - {crown_height_lt_m: 20.0, min_distance_m: 1.0}
    measured: network_outer_surface_to_trunk_outer_surface
    severity: conditional_measure
    measure_ru: "устройство защитных прикорневых барьеров не более чем с двух сторон ствола, из безопасного для корней материала, перенаправляющих рост корней от сети"
    source_refs: [sp42_t9_1_note4, sp42_t9_1_note5, sp42_t9_1_note6, sp42_t9_1_note7]

  defaults:
    # Если диаметр трубы не удалось разобрать из подписи слоя up — консервативные значения
    unknown_pipe_outer_diameter_m: 0.5
    unknown_heating_channel_width_m: 1.5
    trunk_diameter_at_planting_m: 0.10   # крупномер ствол ~8–12 см
    status: assumption
    source_ref: design_assumption

rules:

  # ===========================================================================
  # 1. ПОДЗЕМНЫЕ СЕТИ — СП 42.13330.2016, табл. 9.1 (между наружными поверхностями)
  # ===========================================================================

  - id: sp42_gas_tree
    root_barrier: true
    obstacle: gas_pipeline
    target: tree
    distance_m: 1.5
    measured_from: network_outer_surface
    measured_to: trunk_outer_surface
    severity: prohibitive
    source_ref: sp42_t9_1_gas_sewer
    competing: [{source_ref: ppm743_p3_6_3_t3_6_1, distance_m: 1.5}]

  - id: sp42_gas_shrub
    obstacle: gas_pipeline
    target: shrub
    distance_m: null
    severity: prohibitive
    source_ref: sp42_t9_1_gas_sewer
    note_ru: "прочерк — норма не установлена, посадка кустарника возможна (ответ постановщика 16.09.2026)"

  - id: sp42_sewer_tree
    root_barrier: true
    obstacle: [sewer, sewer_pressure, stormwater]
    target: tree
    distance_m: 1.5
    measured_from: network_outer_surface
    measured_to: trunk_outer_surface
    severity: prohibitive
    source_ref: sp42_t9_1_gas_sewer
    competing: [{source_ref: ppm743_p3_6_3_t3_6_1, distance_m: 1.5}]

  - id: sp42_sewer_shrub
    obstacle: [sewer, sewer_pressure, stormwater]
    target: shrub
    distance_m: null
    severity: prohibitive
    source_ref: sp42_t9_1_gas_sewer

  - id: sp42_heating_tree
    root_barrier: true
    obstacle: heating_network
    target: tree
    distance_m: 2.0
    measured_from: network_outer_surface   # стенка канала/тоннеля или оболочка бесканальной прокладки
    measured_to: trunk_outer_surface
    severity: prohibitive
    source_ref: sp42_t9_1_heating
    competing: [{source_ref: ppm743_p3_6_3_t3_6_1, distance_m: 2.0, row_ru: "теплопровод, трубопровод, теплосеть"}]

  - id: sp42_heating_shrub
    obstacle: heating_network
    target: shrub
    distance_m: 1.0
    measured_from: network_outer_surface
    measured_to: trunk_outer_surface
    severity: prohibitive
    source_ref: sp42_t9_1_heating
    competing: [{source_ref: ppm743_p3_6_3_t3_6_1, distance_m: 1.0}]

  - id: sp42_water_tree
    root_barrier: true
    obstacle: [water_supply, drainage]
    target: tree
    distance_m: 2.0
    measured_from: network_outer_surface
    measured_to: trunk_outer_surface
    severity: prohibitive
    source_ref: sp42_t9_1_water_drainage
    competing: [{source_ref: ppm743_p3_6_3_t3_6_1, distance_m: 2.0}]

  - id: sp42_water_shrub
    obstacle: [water_supply, drainage]
    target: shrub
    distance_m: null
    severity: prohibitive
    source_ref: sp42_t9_1_water_drainage

  - id: sp42_cable_tree
    root_barrier: true
    obstacle: [power_cable, communication_cable, cable_unknown]
    target: tree
    distance_m: 2.0
    measured_from: network_outer_surface
    measured_to: trunk_outer_surface
    severity: prohibitive
    source_ref: sp42_t9_1_cable
    competing: [{source_ref: ppm743_p3_6_3_t3_6_1, distance_m: 2.0}]

  - id: sp42_cable_shrub
    obstacle: [power_cable, communication_cable, cable_unknown]
    target: shrub
    distance_m: 0.7
    measured_from: network_outer_surface
    measured_to: trunk_outer_surface
    severity: prohibitive
    source_ref: sp42_t9_1_cable
    competing: [{source_ref: ppm743_p3_6_3_t3_6_1, distance_m: 0.7}]

  - id: sp42_lks_tmk_tree
    root_barrier: true
    obstacle: lks_tmk
    target: tree
    distance_m: 1.0
    measured_from: network_outer_surface
    measured_to: trunk_outer_surface
    severity: prohibitive
    source_ref: sp42_t9_1_lks_tmk
    note_ru: "линейно-кабельные сооружения транспортной многоканальной коммуникации; применять только при явной идентификации, иначе — кабель связи"

  - id: sp42_lks_tmk_shrub
    obstacle: lks_tmk
    target: shrub
    distance_m: 0.5
    measured_from: network_outer_surface
    measured_to: trunk_outer_surface
    severity: prohibitive
    source_ref: sp42_t9_1_lks_tmk

  - id: utility_tunnel_tree_assumed
    obstacle: utility_tunnel
    target: [tree, shrub]
    distance_m: {tree: 2.0, shrub: 1.0}
    measured_from: network_outer_surface
    measured_to: trunk_outer_surface
    severity: prohibitive
    source_ref: sp42_t9_1_heating
    status: assumption
    assumption_ref: design_assumption
    note_ru: "общий коллектор в табл. 9.1 не выделен; применена строка «стенка канала, тоннеля» по аналогии — вопрос экспертам"

  - id: unknown_network_conservative
    obstacle: network_unknown
    target: [tree, shrub]
    distance_m: {tree: 2.0, shrub: 1.0}
    measured_from: network_outer_surface
    measured_to: trunk_outer_surface
    severity: prohibitive
    source_ref: sp42_t9_1_heating
    status: assumption
    assumption_ref: design_assumption
    note_ru: "тип сети не распознан — применён максимальный табличный отступ"

  # ===========================================================================
  # 2. ОХРАННЫЕ ЗОНЫ (режим «только с согласия/разрешения»)
  #    По умолчанию не применяются (activation: protection_zones) — ответ постановщика
  #    16.09.2026: сверх табличных отступов охранные зоны учитывать не требуется.
  # ===========================================================================

  - id: pp878_zone
    activation: protection_zones
    obstacle: gas_pipeline
    target: [tree, shrub]
    zone_m: 2.0
    zone_m_pe_with_copper_wire: {wire_side: 3.0, other_side: 2.0}
    measured_from: zone_from_network_axis
    measured_to: trunk_axis
    severity: conditional
    source_refs: [pp878_p7, pp878_p16]
    condition_ru: "письменное разрешение эксплуатационной организации газораспределительных сетей"
    rationale_ru: >-
      Охранная зона вдоль трасс наружных газопроводов — 2 м с каждой стороны. Посадка требует
      нарушения грунта глубже 0,3 м (посадочная яма 0,65–1,15 м по 743-ПП), что в охранной зоне
      допускается только на основании письменного разрешения эксплуатационной организации.
      Прямого запрета посадки деревьев в Правилах нет.
    applicability_note_ru: "статус ПП 878 после 09.08.2025 уточнить (см. citations.yaml pp878_p7)"

  - id: pp878_grp_zone
    activation: protection_zones
    obstacle: gas_regulator_point
    target: [tree, shrub]
    zone_m: 10.0
    measured_from: object_boundary
    measured_to: trunk_axis
    severity: conditional
    source_ref: pp878_p7
    verification: needs_check
    note_ru: "значение 10 м в выгрузке не сверено — выводить без номера подпункта"

  - id: pr197_heating_zone
    activation: protection_zones
    obstacle: heating_network
    target: [tree, shrub]
    zone_m: 3.0
    measured_from: zone_from_structure_edge
    measured_to: trunk_axis
    severity: conditional
    source_refs: [pr197_p4, pr197_p6]
    condition_ru: "письменное согласие предприятия, в ведении которого находится тепловая сеть"

  - id: pp160_cable_zone
    activation: protection_zones
    obstacle: power_cable
    target: [tree, shrub]
    zone_m: 1.0
    zone_m_under_sidewalk_to_buildings_le_1kv: 0.6
    measured_from: zone_from_network_axis   # от крайних кабелей
    measured_to: trunk_axis
    severity: conditional
    source_refs: [pp160_annex_kl, pp160_p11z]
    condition_ru: "соблюдение условий, предусмотренных решением о согласовании охранной зоны"

  - id: pp160_overhead_zone
    activation: protection_zones
    obstacle: overhead_line
    target: [tree, shrub]
    measured_from: outer_conductor
    measured_to: trunk_axis
    severity: conditional
    source_refs: [pp160_annex_vl, pp160_p11z]
    zone_by_voltage_kv:
      - {max_kv: 1,    zone_m: 2.0,  note_ru: "для СИП по стенам — по минимальным допустимым расстояниям"}
      - {max_kv: 20,   zone_m: 10.0, zone_m_sip_in_settlement: 5.0}
      - {max_kv: 35,   zone_m: 15.0}
      - {max_kv: 110,  zone_m: 20.0}
      - {max_kv: 220,  zone_m: 25.0}
      - {max_kv: 500,  zone_m: 30.0}
      - {max_kv: 750,  zone_m: 40.0}
      - {max_kv: 1150, zone_m: 55.0}
    unknown_voltage_policy: "10 кВ (типично для города) с пометкой; при отсутствии данных — вопрос"

  - id: pue_overhead_to_tree
    obstacle: overhead_line
    target: tree
    measured_from: outer_conductor
    measured_to: crown_edge            # табл. 2.5.21 — «между проводами ВЛ и кронами деревьев»
    severity: prohibitive
    source_refs: [sp42_t9_1_note2, pue_p2_4_8, pue_t2_5_21]
    distance_by_voltage_kv:
      - {max_kv: 1,   distance_m: 1.0, note_ru: "п. 2.4.8: неизолированные провода — 1 м, изолированные — 0,5 м, СИП — 0,3 м; тип провода по чертежу не известен — принято наибольшее"}
      - {max_kv: 20,  distance_m: 3.0}
      - {max_kv: 110, distance_m: 4.0}
      - {max_kv: 220, distance_m: 5.0}
      - {max_kv: 500, distance_m: 6.0}
      - {max_kv: 750, distance_m: 7.0}
    verification: verified
    note_ru: "прим. 2 к табл. 9.1 СП 42 отсылает к ПУЭ; главы 2.4 и 2.5 ПУЭ сверены 29.09.2026. Напряжение ВЛ по чертежу не известно — принимается design.unknown_overhead_voltage_kv (по умолчанию 10 кВ). По п. 2.5.217 расстояние считается от отклонённых проводов — провод берётся по линии чертежа, отклонение ветром не учитывается. Для ВЛ до 1 кВ п. 2.4.8 касается и кустов — правило пока только для деревьев"

  - id: pp578_comm_zone
    activation: protection_zones
    obstacle: communication_cable
    target: tree              # в п. 48 названа только посадка деревьев
    zone_m: 2.0
    measured_from: zone_from_network_axis
    measured_to: trunk_axis
    severity: conditional
    source_refs: [pp578_p4, pp578_p48v]
    condition_ru: "письменное согласие и присутствие представителей предприятия, эксплуатирующего линию связи"
    note_ru: "применимость 2 м в городе неоднозначна (п. 4 «вне населённых пунктов на безлесных участках») — принято консервативно"

  # ===========================================================================
  # 3. ЗДАНИЯ, СООРУЖЕНИЯ, ЭЛЕМЕНТЫ УДС — табл. 9.1 СП 42 (до оси ствола)
  # ===========================================================================

  - {id: sp42_building_tree,    obstacle: building_wall,    target: tree,  distance_m: 5.0, measured_from: outer_wall,    measured_to: trunk_axis, severity: prohibitive, source_ref: sp42_t9_1_building, competing: [{source_ref: ppm743_p3_6_3_t3_6_1, distance_m: 5.0}]}
  - {id: sp42_building_shrub,   obstacle: building_wall,    target: shrub, distance_m: 1.5, measured_from: outer_wall,    measured_to: trunk_axis, severity: prohibitive, source_ref: sp42_t9_1_building}
  - {id: sp42_tram_tree,        obstacle: tram_track,       target: tree,  distance_m: 5.0, measured_from: object_edge,   measured_to: trunk_axis, severity: prohibitive, source_ref: sp42_t9_1_tram, competing: [{source_ref: ppm743_p3_6_3_t3_6_1, distance_m: 5.0, row_ru: "Ось трамвайных путей"}]}
  - {id: sp42_tram_shrub,       obstacle: tram_track,       target: shrub, distance_m: 3.0, measured_from: object_edge,   measured_to: trunk_axis, severity: prohibitive, source_ref: sp42_t9_1_tram}
  - {id: sp42_sidewalk_tree,    obstacle: sidewalk_edge,    target: tree,  distance_m: 0.7, measured_from: object_edge,   measured_to: trunk_axis, severity: prohibitive, source_ref: sp42_t9_1_sidewalk}
  - {id: sp42_sidewalk_shrub,   obstacle: sidewalk_edge,    target: shrub, distance_m: 0.5, measured_from: object_edge,   measured_to: trunk_axis, severity: prohibitive, source_ref: sp42_t9_1_sidewalk}
  - {id: sp42_carriageway_tree, obstacle: carriageway_edge, target: tree,  distance_m: 2.0, measured_from: object_edge,   measured_to: trunk_axis, severity: prohibitive, source_ref: sp42_t9_1_carriageway, root_barrier: true}
  - {id: sp42_carriageway_shrub,obstacle: carriageway_edge, target: shrub, distance_m: 1.0, measured_from: object_edge,   measured_to: trunk_axis, severity: prohibitive, source_ref: sp42_t9_1_carriageway}
  - {id: sp42_pole_tree,        obstacle: [lighting_pole, traffic_light_pole, bridge_support], target: tree, distance_m: 4.0, measured_from: object_center, measured_to: trunk_axis, severity: prohibitive, source_ref: sp42_t9_1_pole}
  - {id: sp42_pole_shrub,       obstacle: [lighting_pole, traffic_light_pole, bridge_support], target: shrub, distance_m: null, severity: prohibitive, source_ref: sp42_t9_1_pole}
  - {id: sp42_slope_tree,       obstacle: slope_toe,        target: tree,  distance_m: 1.0, measured_from: object_edge,   measured_to: trunk_axis, severity: prohibitive, source_ref: sp42_t9_1_slope}
  - {id: sp42_slope_shrub,      obstacle: slope_toe,        target: shrub, distance_m: 0.5, measured_from: object_edge,   measured_to: trunk_axis, severity: prohibitive, source_ref: sp42_t9_1_slope}
  - {id: sp42_retaining_tree,   obstacle: retaining_wall,   target: tree,  distance_m: 3.0, measured_from: object_edge,   measured_to: trunk_axis, severity: prohibitive, source_ref: sp42_t9_1_retaining}
  - {id: sp42_retaining_shrub,  obstacle: retaining_wall,   target: shrub, distance_m: 1.0, measured_from: object_edge,   measured_to: trunk_axis, severity: prohibitive, source_ref: sp42_t9_1_retaining}

  - id: design_snow_buffer_carriageway
    obstacle: carriageway_edge
    target: [tree, shrub]
    distance_m: 1.0
    measured_from: object_edge
    measured_to: trunk_axis
    severity: prohibitive
    crown_increment: false
    source_ref: qa_session_2026_09_16
    status: assumption
    assumption_ref: design_assumption
    note_ru: >-
      Рекомендация постановщика 16.09.2026: посадки не ближе 1 м к уличному фронту, даже у
      кармана — первый метр страдает от снегоуборочной техники. Нижняя граница для сокращения
      отступа с корнезащитой; при табличных отступах сама не ограничивает.

  - id: ppm743_school_kindergarten_tree
    obstacle: school_kindergarten_wall
    target: tree
    distance_m: 10.0
    measured_from: outer_wall
    measured_to: trunk_axis
    severity: prohibitive
    source_ref: ppm743_p3_6_3_t3_6_1
    note_ru: "строка есть в 743-ПП (по МГСН 1.01-99), в СП 42.13330.2016 отсутствует; применяется при известном назначении здания"

  - id: ppm743_school_kindergarten_shrub
    obstacle: school_kindergarten_wall
    target: shrub
    distance_m: 1.5
    measured_from: outer_wall
    measured_to: trunk_axis
    severity: prohibitive
    source_ref: ppm743_p3_6_3_t3_6_1

  - id: ppm743_wide_crown_residential
    obstacle: residential_building_windows
    target: tree
    species_crown_class: wide          # липа, клён, дуб, каштан, тополь и др.
    distance_m: 10.0
    measured_from: outer_wall
    measured_to: trunk_axis
    severity: prohibitive
    source_ref: ppm743_t3_6_1_note3
    note_ru: "применяется, если известно, что здание жилое и дерево затеняет жилые помещения; иначе — advisory"

  - id: tsn_bus_shelter_tree
    obstacle: bus_shelter
    target: tree
    distance_m: 2.0
    measured_from: object_edge          # боковые конструкции павильона
    measured_to: trunk_axis
    severity: prohibitive
    species_constraint_ru: "деревья с компактной кроной"
    source_ref: tsn_p4_10_4

  - id: tsn_kiosk_tree
    obstacle: kiosk_nonpermanent
    target: tree
    distance_m: 3.0
    measured_from: object_edge
    measured_to: trunk_axis
    severity: advisory
    source_ref: tsn_p4_10_2_1
    note_ru: "норма сформулирована для размещения НТО относительно деревьев; для новой посадки у существующего НТО — рекомендация"

  # ===========================================================================
  # 4. ТЕПЛОТРАССЫ: прогрев грунта и породы — ТСН 30-307-2002 п. 4.2.8
  # ===========================================================================

  - id: tsn_heating_species_2m
    obstacle: heating_network
    target: [tree, shrub]
    species_ru: ["липа", "клён", "сирень", "жимолость"]
    distance_m: 2.0
    measured_from: network_axis
    measured_to: trunk_axis
    severity: advisory                 # «не следует»
    source_ref: tsn_p4_2_8

  - id: tsn_heating_species_3_4m
    obstacle: heating_network
    target: [tree, shrub]
    species_ru: ["тополь", "боярышник", "кизильник", "дёрен", "лиственница", "берёза"]
    distance_m: 4.0
    distance_range_m: [3.0, 4.0]
    measured_from: network_axis
    measured_to: trunk_axis
    severity: advisory
    source_ref: tsn_p4_2_8

  - id: tsn_heating_soil_warming
    obstacle: heating_network
    target: tree
    zones_from_axis_m: {intensive: [0, 2], medium: [2, 6], weak: [6, 10]}
    severity: advisory
    source_ref: tsn_p4_2_8
    rationale_ru: "учитывать прогрев почвы при подборе пород; в зоне среднего прогрева — устойчивые к иссушению породы"

  # ===========================================================================
  # 5. ГОРОДСКАЯ СРЕДА
  # ===========================================================================

  - id: sp42_sight_triangle
    obstacle: sight_triangle
    target: [tree, shrub]
    rule_type: zone_exclusion
    height_threshold_m: 0.5
    severity: prohibitive
    source_ref: sp42_p11_16
    geometry_ru: "размеры сторон — по расчёту согласно СП 396.1325800; в решении — входной параметр/слой"
    params_status: needs_input

  - id: sp4_fire_access_row_planting
    obstacle: fire_access_zone          # территория между подъездом пожарных автомобилей и зданием
    target: tree
    rule_type: zone_exclusion
    applies_to_pattern: row
    severity: prohibitive
    source_ref: sp4_p8_1_2

  - id: sp59_pedestrian_clear_width
    obstacle: pedestrian_path
    target: [tree, shrub]
    rule_type: residual_width
    min_clear_width_m: 2.0
    constrained_min_clear_width_m: 1.2
    constrained_passing_pocket: {every_m: 25, length_m: 2.5, total_width_m: 2.0}
    severity: prohibitive
    source_ref: sp59_p5_1_7

  - id: sp59_pedestrian_clear_height
    obstacle: pedestrian_path
    target: tree
    rule_type: vertical_clearance
    min_clear_height_m: 2.1
    severity: advisory                  # обеспечивается формовкой кроны
    source_ref: sp59_p5_1_7

  - id: sp42_insolation
    obstacle: building_wall
    target: tree
    rule_type: qualitative
    severity: advisory
    source_refs: [sp42_t9_1_note3, ppm743_t3_6_1_note2]

  - id: tsn_paving_protection
    obstacle: paving
    target: tree
    rule_type: protection_measure
    protective_surface_radius_m: 1.5
    severity: advisory
    source_ref: tsn_p4_3_7

  - id: tsn_trunk_guard
    obstacle: intensive_pedestrian_zone
    target: tree
    rule_type: protection_measure
    guard_min_height_m: 0.9
    guard_min_diameter_m: 0.8
    severity: advisory
    source_ref: tsn_p4_5_5

  - id: soil_depth_over_underground_structure
    obstacle: underground_structure_roof
    target: [tree, shrub]
    rule_type: soil_depth
    min_soil_depth_from_pit_table: true   # глубина ямы по 743-ПП табл. 3.3.1 / ТСН табл. 4.3
    severity: prohibitive
    source_refs: [ppm743_p3_3_1_t3_3_1, tsn_t4_3]
    status: assumption
    assumption_ref: design_assumption
    note_ru: "прямой нормы толщины грунта над сооружением в проверенных текстах не найдено; требуем, чтобы помещалась стандартная посадочная яма"

  # ===========================================================================
  # 6. ШАГ, ПЛОТНОСТЬ, ЯМЫ
  # ===========================================================================

  - id: ppm743_spacing_street
    rule_type: mutual_spacing
    context: street_arterial
    spacing_m:
      tree_single_row: [5.0, 6.0]
      tree_double_row: [7.0, 8.0]
      shrub_single_row_tall_gt_1_8m: [0.5, 1.0]
      shrub_single_row_medium_low: [0.3, 0.4]
      tree_group: [5.0, 7.0]
      shrub_group: 0.3
    shrub_row_strip_increment_m: [1.5, 2.0]   # примечание к табл. 3.6.2: на каждый дополнительный ряд кустарника
    severity: advisory                 # «ориентировочные»
    source_ref: ppm743_p3_6_4_t3_6_2

  - id: tsn_noise_row_spacing
    rule_type: mutual_spacing
    context: noise_protection_row
    spacing_m: {wide_crown: [8.0, 10.0], medium_crown: [5.0, 6.0], narrow_crown: [3.0, 4.0]}
    min_row_height_m: 7.0
    severity: advisory
    source_ref: tsn_p4_2_9_2

  - id: tsn_max_density
    rule_type: density_cap
    per: {streets_embankments: "1 км", other: "1 га"}
    max_count:
      streets_embankments: {trees: [150, 180], shrubs: [600, 720]}
      squares: {trees: [100, 130], shrubs: [1000, 1300]}
      boulevards: {trees: [200, 300], shrubs: [1200, 1300]}
      residential: {trees: [100, 120], shrubs: [400, 480]}
    severity: advisory
    source_ref: tsn_tV1

  - id: planting_pits
    rule_type: pit_dimensions
    source_refs: [ppm743_p3_3_1_t3_3_1, tsn_t4_3]
    severity: advisory
    note_ru: "размер ямы используется для проверки конфликта с сетями и толщины грунта; таблицы — в citations"

  # ===========================================================================
  # 7. АССОРТИМЕНТ
  # ===========================================================================

  - id: invasive_species_filter
    rule_type: assortment_filter
    data: knowledge/plants/invasive_moscow.yaml
    severity: prohibitive
    source_refs: [ppm369_invasive, mpr77_invasive]
    output_policy_ru: "для видов со статусом secondary/conflicting — «условно допустимо, проверить по 369-ПП», без номера пункта"
