meta:
  version: "0.1.0"
  updated: "2026-09-15"
  layer_pattern: '^_(?P<existing>[^-]+?)\s*-\s*(?P<target>[^(]+?)\s*(\(.*\))?$'

surface_classes:
  lawn: ["ГЗН"]
  carriageway: ["АБ ПЧ", "ЩМА ПЧ", "ПЧ"]
  sidewalk: ["АБ ТР", "ПЛ ТР", "Резин.КР", "ТР"]
  slope: ["Укрепление откоса", "Откос до укрепления"]

# Проектные покрытия, названные словами, а не парой «было-стало» (Харьковская, Камчатская,
# Измайловская, Наташинский, Старый Гай, Макеева, Нижние Поля, Лодочная). Порядок важен:
# первое совпадение выигрывает. Слой «ПЧ за ГАЗОН» — это новая проезжая часть на месте газона,
# то есть покрытие, а не зона посадки; «Газон за ПЧ» — наоборот, новый газон.
project_surface_layers:
  - {layer_regex: '(?i)(пч|проезж).{0,15}за\s*газон', class: carriageway, note: "проезжая часть устраивается за счёт газона"}
  - {layer_regex: '(?i)(трот|трт|плитк|щебен).{0,20}газон', class: sidewalk, note: "тротуар или мощение за счёт газона"}
  - {layer_regex: '(?i)^(?!.*цветник).*газон', class: lawn, note: "проектный газон: устраиваемый, рулонный, восстанавливаемый, контур существующего"}

fallback_green_area_layers:
  - "Леса и газоны"
