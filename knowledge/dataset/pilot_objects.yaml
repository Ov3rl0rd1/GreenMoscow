# Пары «вход → эталон» по датасету «Пилотный проект 20 улиц» для обучения и оценки модели.
# Пути — относительно data/pilot/Пилотный проект 20 улиц/ (каталог data/ не в git).
# Схема слоёв эталона — id из knowledge/dataset/reference_layer_conventions.yaml;
# null означает «схема не определена вручную», экстрактор подбирает её сам по числу совпадений.
#
# level:
#   A — канонические тайлы Мосгеотреста и понятный эталон посадок (основа обучения)
#   B — подоснова пересобрана или эталон нестандартный (проверка устойчивости)

meta:
  version: "0.1.0"
  updated: "2026-09-16"
  dataset_root: "data/pilot/Пилотный проект 20 улиц"

objects:
  - id: olimpiyskaya
    name: "1. Олимпийская деревня"
    level: A
    layer_scheme: plnt_prefix
    input: "1. Олимпийская деревня/Исходные данные/10000176_Генплан_Олимп - Standard/_06_10000176_Генплан_Олимп.dwg"
    reference: "1. Олимпийская деревня/Проектное решение/Олимпийская_посадочный.dwg"

  - id: kharkovskaya
    name: "4. Харьковская улица"
    level: A
    layer_scheme: gp_parentheses
    input: "4. Харьковская улица/Исходные данные/Генплан Харьковская/Харьковская АПОТ_2026-01-15.dwg"
    reference: "4. Харьковская улица/Проектное решение/DWG/Харьковская ул_Посадочный+.dwg"

  - id: bagritskogo
    name: "5. Багрицкого улица"
    level: A
    layer_scheme: pl_prefix
    input: "5. Багрицкого улица/Исходные данные/10000450_ул Багрицкого_ГП и ПБ/ГП и ПБ ул Багрицкого.dwg"
    reference: "5. Багрицкого улица/Проектное решение/DWG/01_ГП ул Багрицкого_Озеленение.dwg"

  - id: kamchatskaya
    name: "6. Камчатская улица"
    level: B
    layer_scheme: null
    input: "6. Камчатская улица/Исходные данные/04_10001636-АПОТ-ГЧ-17.01.26.dwg"
    reference: "6. Камчатская улица/Проектное решение/dwg_/Катчатская_Посадочный.dwg"

  - id: nizhnie_polya
    name: "7. Нижние Поля ул"
    level: B
    layer_scheme: null
    input: "7. Нижние Поля ул/Исходные данные/02_ГП - Standard/02_ГП.dwg"
    reference: "7. Нижние Поля ул/Проектное решение_/DWG/Нижние поля_дендроплан.dwg"

  - id: lodochnaya
    name: "8. Лодочная"
    level: B
    layer_scheme: null
    input: "8. Лодочная/Исходные данный/06_Л_Генеральный план М 1_500 - Standard/06_Л_Генеральный план М 1_500.dwg"
    reference: "8. Лодочная/Проектное решение/DWG/03_Л_План благоустройства и компенсационного озеленения М 1_500.dwg"

  - id: izmaylovskaya
    name: "9. Измайловская площадь"
    level: A
    layer_scheme: dendro_prefix
    input: "9. Измайловская площадь_/Исходные данные/01_25_ДВ_ВАО_10001620_АПОТ - Standard/01_25_ДВ_ВАО_10001620_АПОТ.dwg"
    reference: "9. Измайловская площадь_/Проектное решение/DWG/ИТОГ_Дендроплан - Standard/Разбивочно-посадочный.dwg"

  - id: staryy_gay
