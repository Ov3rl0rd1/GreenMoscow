    reference: "13. Харьковский проезд/Проектное решение/DWG/Харьковский пр-д_Посадочный+++.dwg"

  - id: berzarina
    name: "16. улица Берзарина"
    level: A
    layer_scheme: dp_numbered
    input: "16. улица Берзарина/Исходные данные/10004588_улица Берзарина_ГП.dwg"
    reference: "16. улица Берзарина/Проектное решение/DWG/Посадочный план.dwg"

  - id: makeeva
    name: "20. Макеева С. ул"
    level: A
    layer_scheme: dendroplan_numbered
    input: "20. Макеева С. ул/Исходные данные/Генплан/10001121 - Standard/10001121.dwg"
    reference: "20. Макеева С. ул/Проектное решение/ГР_Макеева/xref_растительность.dwg"
