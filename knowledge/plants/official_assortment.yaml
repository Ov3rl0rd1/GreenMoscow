meta:
  title_ru: Ассортимент деревьев, кустарников и лиан для озеленения различных категорий территорий города Москвы
    (основной, дополнительный, перспективный)
  publisher_ru: ДПиООС города Москвы, mos.ru
  received: '2026-09-23'
  sources:
  - research/raw/assortment/main_and_additional_assortment.docx
  - research/raw/assortment/perspective_species.docx
  species_count: 329
columns:
- id: yards
  number: 1
  name_ru: Дворовые территории
  short_ru: дворовые территории
- id: preschool
  number: 2
  name_ru: Дошкольные учреждения
  short_ru: дошкольные учреждения
- id: schools_sport
  number: 3
  name_ru: Общеобразовательные и спортивные учреждения (школы, колледжи)
  short_ru: школы, колледжи и спортивные учреждения
- id: healthcare
  number: 4
  name_ru: Учреждения здравоохранения и реабилитационные центры
  short_ru: учреждения здравоохранения
- id: roads
  number: 5
  name_ru: Магистрали (шоссе, проспекты, улицы с высокоскоростным движением, кольцевые дороги и хорды), *внутриквартальные
    улицы и проезды местного значения
  short_ru: магистрали и внутриквартальные улицы
- id: public_spaces
  number: 6
  name_ru: Площади, пространства общественно-делового и торгово-развлекательного назначения
  short_ru: площади и общественные пространства
- id: parks
  number: 7
  name_ru: Парки, *бульвары, скверы, набережные, сады
  short_ru: парки, бульвары, скверы, набережные
- id: industrial
  number: 8
  name_ru: Территории производственного назначения, *озеленённые территории охранных и санитарно-защитных зон
  short_ru: производственные и санитарно-защитные территории
notes:
  1: Разрешён на всех территориях, кроме ООЗТ и ПТ, с контролем распространения (п. 5 ПП №369-ПП)
  2: Не высаживать вблизи детских и спортивных площадок, мест массового пребывания детей
  3: 'Требует особого ухода: защита корневой системы от травм, весеннее дождевание кроны (при посадке у дорог),
    мульчирование, рыхление'
  4: Требует дренированных, рыхлых, незасоленных, неуплотнённых почв. Не высаживать в зонах с застойным увлажнением
    и на уплотнённых грунтах
  5: Чувствительно к противогололёдным реагентам и выхлопным газам
  6: Не высаживать вблизи плодовых культур (яблоня, груша, айва) из-за риска распространения ржавчинных грибов
  7: Вид с потенциалом самосева и неконтролируемого распространения. За пределами ООЗТ посадка допускается на расстоянии
    от 1 до 2 км от их границ при условии регулярного контроля
footnotes_ru:
- На территориях ботанических, зоологических садов, кладбищ, мемориальных комплексов и религиозных организаций породный
  состав для озеленения определяется балансодержателем. В границах особо охраняемых природных территорий, особо
  охраняемых зеленых территорий, природных территорий на участках, занятых естественными растительными сообществами,
  породный состав определяется на основании проекта мероприятий по сохранению, развитию и воспроизводству насаждений.
- На территориях инклюзивных площадок для людей с ограниченными возможностями породный состав определяется на основании
  проекта мероприятий по сохранению, развитию и воспроизводству насаждений.
- На территориях высших учебных заведений породный состав определяется на основании проекта мероприятий по сохранению,
  развитию и воспроизводству насаждений.
- '*Обозначенный перечень территорий озеленения вне границ ООЗТ, на которых возможна высадка рекомендуемого растения
  при условии контроля его распространения.'
- На территориях ботанических, зоологических садов, кладбищ, мемориальных комплексов и религиозных организаций породный
  состав для озеленения определяется балансодержателем. В границах особо охраняемых природных территорий, особо
  охраняемых зеленых территорий, природных территорий на участках, занятых естественными растительными сообществами,
  породный состав определяется на основании проекта мероприятий по сохранению, развитию и воспроизводству насаждений.
