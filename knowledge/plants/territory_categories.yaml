# Категории территорий для подбора пород и состава посадок (Ф15).
#
# Категория задаётся параметром прогона (territory.category). От неё зависят:
#   official_columns — столбцы официальной таблицы ассортимента ДПиООС
#                      (official_assortment.yaml); вид допустим, если во всех стоит «+».
#                      Основной источник с 23.09.2026;
#   children_sensitive — виды с примечанием [2] («не высаживать вблизи детских и спортивных
#                      площадок») исключаются;
#   tsn_column       — столбец таблицы В.6 ТСН 30-307 (territory_suitability.yaml) — запасной
#                      источник для видов, которых нет в официальной таблице;
#   density_context  — контекст правила tsn_max_density (norms.yaml) для лимита плотности;
#   conifers_near_carriageway — допустимы ли хвойные у проезжей части;
#   composition_ru   — принцип состава посадок для объяснения.
# Категории и принципы состава — по ответам постановщика 16.09.2026:
# вдоль дорог — многоярусная аллея для снижения шума и пыли; во дворах аллей нет, разве что
# плотная живая изгородь вокруг детских площадок; хвойные неустойчивы вдоль дорог и магистралей.

meta:
  version: "1.1.0"
  updated: "2026-09-23"
  default: district_street
  source_refs: [dpioos_assortment_main, tsn_tV6, tsn_tV1, qa_session_2026_09_16]

categories:

  - id: magistral
    official_columns: [roads]
    name_ru: "магистральная улица"
    tsn_column: streets_roads
    density_context: streets_embankments
    conifers_near_carriageway: false
    noise_protection: true
    composition_ru: "многоярусная посадка вдоль проезжей части: высокие деревья, кустарник, газон — снижение шума и пыли"

  - id: district_street
    official_columns: [roads]
    name_ru: "улица районного значения"
    tsn_column: streets_roads
