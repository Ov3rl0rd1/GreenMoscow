# Инвазивные виды растений: фильтр ассортимента генератора.
#
# Два источника:
#  1) Постановление Правительства Москвы от 03.03.2026 № 369-ПП «О мерах по регулированию
#     распространения и численности инвазивных растений на территории города Москвы».
#     Приложение 1 — Перечень инвазивных видов растений (4 группы), приложение 2 — Порядок
#     осуществления мер. Официальный текст сверен 29.09.2026 (КонсультантПлюс, сохранён 29.09.2026).
#     Порядок: группы I, II, IV — запрет высадки (пп. 2.4, 3.1, 4.1, 6.1); группа III — высадка
#     не допускается на ООЗТ и природных территориях (п. 5.2), на иных территориях зелёного фонда
#     допускается при мерах по недопущению распространения (п. 5.3).
#  2) Приказ Минприроды России от 13.02.2026 № 77 — федеральный перечень опасных видов
#     инвазивных (чужеродных) растений для ООПТ федерального значения. Текст получен
#     (research/norms-texts/Prikaz_MPR_77_2026_federal_invasive_list.txt).
#
# latin — имя для сопоставления с ассортиментом; latin_official — как в тексте постановления.

meta:
  version: "0.3.0"
  updated: "2026-09-29"
  generator_policy:
    group_I:   exclude
    group_II:  exclude
    group_III: allow_with_control
    group_IV:  exclude
    federal_77_central: exclude
    unverified_conflict: conditional  # вид помечен в ассортименте как спорный — «условно, проверить по 369-ПП»

moscow_369pp:
  source_ref: ppm369_invasive
  groups:
    I:
      description_ru: "запрет высадки и закупки (пп. 2.3, 2.4, 3.1 Порядка); полное удаление в течение одного календарного года после выявления (п. 3.2; для айланта, золотарников, люпина и рейнутрии — с 01.01.2027, п. 6 постановления)"
      verification: verified
      species:
        - {ru: "Айлант высочайший",        latin: "Ailanthus altissima",   latin_official: "Ailanthus altissima (Mill.) Swingle"}
        - {ru: "Борщевик Сосновского",     latin: "Heracleum sosnowskyi",  latin_official: "Heracleum sosnowskyi Manden"}
        - {ru: "Золотарник канадский",     latin: "Solidago canadensis",   latin_official: "Solidago canadensis, gigantea"}
        - {ru: "Золотарник гигантский",    latin: "Solidago gigantea",     latin_official: "Solidago canadensis, gigantea"}
        - {ru: "Люпин многолистный",       latin: "Lupinus polyphyllus",   latin_official: "Lupinus polyphyllus Lindl."}
        - {ru: "Рейнутрия",                latin: "Reynoutria spp.",       latin_official: "Reynoutria ssp."}
    II:
      description_ru: "все меры п. 2 Порядка, включая запрет высадки (п. 4.1); при плановом озеленении, реконструкции и комплексном благоустройстве — полное удаление заказчиком работ (п. 4.3), в иных случаях — поэтапно за 10 лет (п. 4.4)"
      verification: verified
      species:
        - {ru: "Клён ясенелистный",        latin: "Acer negundo",          latin_official: "Acer negundo L."}
    III:
      description_ru: >-
        высадка не допускается на ООЗТ и природных территориях (п. 5.2 Порядка); на иных территориях
        зелёного фонда допускается при мерах по недопущению распространения (п. 5.3)
      verification: verified
      species:
        - {ru: "Аморфа кустарниковая",     latin: "Amorpha fruticosa",       latin_official: "Amorpha fruticosa L."}
        - {ru: "Девичий виноград",         latin: "Parthenocissus inserta",  latin_official: "Parthenocissus inserta (A. Kern.) Fritsch"}
        - {ru: "Дёрен белый",              latin: "Cornus alba",             latin_official: "Cornus albus L."}
        - {ru: "Дуб красный",              latin: "Quercus rubra",           latin_official: "Quercus rubra L."}
        - {ru: "Ирга колосистая",          latin: "Amelanchier spicata",     latin_official: "Amelanchier spicata Decne"}
        - {ru: "Ирга ольхолистная",        latin: "Amelanchier alnifolia",   latin_official: "Amelanchier alnifolia (Nutt.) Nutt. ex M. Roem"}
        - {ru: "Облепиха крушиновидная",   latin: "Hippophae rhamnoides",    latin_official: "Hippophae rhamnoides L"}
        - {ru: "Орех маньчжурский",        latin: "Juglans mandshurica",     latin_official: "Juglans mandshurica Maxim."}
        - {ru: "Пузыреплодник калинолистный", latin: "Physocarpus opulifolius", latin_official: "Physocarpus opulifolius Maxim."}
        - {ru: "Робиния псевдоакация (белая акация)", latin: "Robinia pseudoacacia", latin_official: "Robinia pseudoacacia L."}
        - {ru: "Роза морщинистая (шиповник морщинистый)", latin: "Rosa rugosa", latin_official: "Rosa rugosa Thunb"}
        - {ru: "Рябинник рябинолистный",   latin: "Sorbaria sorbifolia",     latin_official: "Sorbaria sorbifolia (L.) A. Braun"}
        - {ru: "Черёмуха виргинская",      latin: "Prunus virginiana",       latin_official: "Prunus virginiana L."}
        - {ru: "Ясень пенсильванский",     latin: "Fraxinus pennsylvanica",  latin_official: "Fraxinus pennsylvanica Marshall"}
    IV:
      description_ru: "запрет высадки и закупки (пп. 2.3, 2.4, 2.6, 6.1 Порядка); травянистые, в ассортимент не входят"
      verification: verified
      species:
        - {ru: "Белокопытник гибридный",    latin: "Petasites hybridus",     latin_official: "Petasites hybridus (L.) G. Gaertn., B. Mey. & Scherb."}
        - {ru: "Вероника нитевидная",       latin: "Veronica filiformis",    latin_official: "Veronica filiformis Sm."}
        - {ru: "Мелколепестник канадский",  latin: "Erigeron canadensis",    latin_official: "Erigeron canadensis L."}
        - {ru: "Недотрога железконосная",   latin: "Impatiens glandulifera", latin_official: "Impatiens glandulifera Royle"}
        - {ru: "Недотрога мелкоцветковая",  latin: "Impatiens parviflora",   latin_official: "Impatiens parviflora DC."}
        - {ru: "Подсолнечник клубневой (топинамбур)", latin: "Helianthus tuberosus", latin_official: "Helianthus tuberosus L."}
        - {ru: "Прилипало пристающее",      latin: "Adenocaulon adhaerescens", latin_official: "Adenocaulon adhaerescens Maxim."}
        - {ru: "Цицания широколистная",     latin: "Zizania latifolia",      latin_official: "Zizania latifolia (Griseb.) Hance ex F. Muell."}
        - {ru: "Череда олиственная",        latin: "Bidens frondosa",        latin_official: "Bidens frondosa L"}
        - {ru: "Элодея канадская",          latin: "Elodea canadensis",      latin_official: "Elodea canadensis Michx"}
        - {ru: "Эхиноцистис лопастной",     latin: "Echinocystis lobata",    latin_official: "Echinocystis lobata (Michx.) Torr. & A. Gray"}

