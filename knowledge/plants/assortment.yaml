# Ассортимент зелёных насаждений для генератора.
#
# ИСТОЧНИКИ:
#  1. Библиотека условных знаков заказчика «Шаблоны значков.dwg» (133 блока, 102 с русскими
#     названиями) — knowledge/symbols/blocks_catalog.json.
#  2. Эталонные планы посадок датасета «Пилотный проект 20 улиц» (15.09.2026) — фактически
#     применяемые породы и сорта (см. reference_usage ниже).
#  3. ТСН 30-307-2002, табл. В.6 — рекомендации пород по категориям насаждений (выгружено частично).
#  4. 369-ПП / Приказ Минприроды № 77 — фильтр инвазивных: knowledge/plants/invasive_moscow.yaml.
#
# ВНИМАНИЕ: crown_d_m / height_m — проектные ориентиры для взрослого растения; НЕ сверены
# с дендрологическими справочниками. Влияют на увеличение отступа (прим. 1 к табл. 9.1
# СП 42.13330.2016), шаг посадки и масштаб условного знака.

meta:
  version: "0.2.0"
  updated: "2026-09-15"
  crown_values_status: assumption
  traits_status: assumption
  traits_source_ref: species_reference_traits
  territory_table: knowledge/plants/territory_suitability.yaml
  noise_barrier_source_ref: tsn_tV5_noise_note
  invasive_filter: knowledge/plants/invasive_moscow.yaml

# ---------------------------------------------------------------------------
# ТИПЫ ПОСАДОК → слои результата (принцип заказчика «порода = слой = блок», префикс AI_)
# ---------------------------------------------------------------------------
plant_types:
  tree:
    ru: "Дерево"
    dxf_layer_pattern: "AI_PL_TREES_{species}"
    spacing_ref: ppm743_p3_6_4_t3_6_2       # в ряд 5–6 м, в два ряда 7–8 м, группа 5–7 м
    default_spacing_m: 6.0
  large_shrub:
    ru: "Крупный кустарник"
    dxf_layer_pattern: "AI_PL_BUSH_{species}"
    default_spacing_m: 1.0                  # высокие (> 1,8 м) в ряд 0,5–1 м
  shrub:
    ru: "Кустарник"
    dxf_layer_pattern: "AI_PL_BUSH_{species}"
    default_spacing_m: 0.4                  # средние и низкие в ряд 0,3–0,4 м
  hedge:
    ru: "Живая изгородь"
    dxf_layer_pattern: "AI_PL_HEDGE_{species}"
    default_spacing_m: 0.3
  groundcover:
    ru: "Травянистое покрытие / газон"
    dxf_layer_pattern: "AI_PL_LAWN"
  flowerbed:
    ru: "Цветник"
    dxf_layer_pattern: "AI_PL_FLWR_{name}"

