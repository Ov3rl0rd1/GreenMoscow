# ---------------------------------------------------------------------------
# ИНВАЗИВНЫЕ ВИДЫ — ИСКЛЮЧАЮТСЯ ИЗ ПОДБОРА
# ---------------------------------------------------------------------------
# ВНИМАНИЕ: перечень ниже — ОЖИДАЕМЫЙ состав, основанный на общеизвестных
# инвазивных видах средней полосы. ФАКТИЧЕСКИЙ перечень должен быть
# взят из приложения к ППМ № 369-ПП от 03.03.2026 и заменить этот список.
# Статус: needs_verification — см. docs/02-normative-verification-checklist.md п. 2.3
invasive_excluded:
  verification: needs_check
  source_ref: ppm369_invasive
  species:
    - ru: "Клён ясенелистный"
      latin: "Acer negundo"
    - ru: "Борщевик Сосновского"
      latin: "Heracleum sosnowskyi"
    - ru: "Золотарник канадский"
      latin: "Solidago canadensis"
    - ru: "Ясень пенсильванский"
      latin: "Fraxinus pennsylvanica"
  note_ru: >-
    Список подлежит замене на официальный перечень из ППМ № 369-ПП.
    До верификации фильтр применяется, но в объяснении указывается
    обобщённая формулировка без номера пункта.

# ---------------------------------------------------------------------------
# ПРАВИЛА ПОДБОРА (таблица решений)
# ---------------------------------------------------------------------------
selection_rules:
  - context: street_carriageway_adjacent      # вдоль проезжей части
    prefer: [tilia_cordata, acer_platanoides, sorbus_aucuparia, ulmus_parvifolia]
    avoid: [betula_pendula, quercus_robur]
    reason_ru: "Требуется устойчивость к противогололёдным реагентам, загазованности и уплотнению почвы."

  - context: narrow_sidewalk                  # узкий тротуар, мало места
    prefer: [acer_ginnala, sorbus_aucuparia, malus_niedzwetzkyana]
    max_crown_d_m: 6.0
    reason_ru: "Ограниченная ширина свободного прохода (СП 59.13330.2020) и малый отступ до края тротуара."

  - context: courtyard                        # двор
    prefer: [tilia_cordata, acer_platanoides, prunus_maackii, malus_niedzwetzkyana]
    reason_ru: "Декоративность и теневой комфорт при отсутствии солевой нагрузки."

  - context: near_heating_network             # зона прогрева грунта 2-6 м
    avoid_all_trees: false
    prefer: [acer_ginnala, cotoneaster_lucidus, physocarpus_opulifolius]
    reason_ru: >-
      В зоне среднего прогрева грунта от теплотрассы (2-6 м по ТСН 30-307-2002)
      предпочтительны породы, устойчивые к иссушению корнеобитаемого слоя.

  - context: hedge_along_fence
    prefer: [cotoneaster_lucidus, spiraea, physocarpus_opulifolius]
    plant_type: hedge

  - context: under_overhead_line              # под ВЛ (вне охранной зоны)
    max_height_m: 4.0
    prefer: [acer_ginnala, syringa_vulgaris, cotoneaster_lucidus]
    reason_ru: "Ограничение по высоте взрослого растения во избежание приближения к проводам."
