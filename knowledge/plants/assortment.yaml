# Ассортимент зелёных насаждений для генератора.
#
# ИСТОЧНИКИ:
#  1. Библиотека условных знаков заказчика "Шаблоны значков.dwg" (133 блока,
#     102 с русскими названиями) — knowledge/symbols/blocks_catalog.json.
#     Это фактический ассортимент, которым оперируют проектировщики заказчика.
#  2. ППМ № 515-ПП (рекомендуемый ассортимент растений) — ТРЕБУЕТ СВЕРКИ.
#  3. ППМ № 369-ПП от 03.03.2026 — перечень инвазивных видов, ОБЯЗАТЕЛЕН К ИСКЛЮЧЕНИЮ.
#
# ВНИМАНИЕ: значения crown_d_m / height_m — проектные ориентиры для взрослого
# растения в городских условиях Москвы. Статус: ТРЕБУЮТ ПРОВЕРКИ по дендрологическим
# справочникам и каталогам питомников перед сдачей. Они влияют на:
#   - масштабирование нормативного отступа (примечание 1 к табл. 9.1 СП 42.13330.2016)
#   - минимальные расстояния между посадками
#   - размер условного знака в DXF

meta:
  version: "0.1.0"
  updated: "2026-09-14"
  crown_values_status: needs_verification
  invasive_filter_source: ppm369_invasive

# ---------------------------------------------------------------------------
# ТИПЫ ПОСАДОК (соответствуют категориям ТЗ и категориям слоёв заказчика)
# ---------------------------------------------------------------------------
plant_types:
  tree:
    ru: "Дерево"
    dxf_layer: GREEN_AI_TREES
    default_spacing_m: 6.0
  large_shrub:
    ru: "Крупный кустарник"
    # у заказчика есть отдельная категория: слои "ЗЕЛЕНЬ$БОЛЬШИЕ КУСТЫ$..."
    dxf_layer: GREEN_AI_SHRUBS
    default_spacing_m: 2.0
  shrub:
    ru: "Кустарник"
    dxf_layer: GREEN_AI_SHRUBS
    default_spacing_m: 1.0
  hedge:
    ru: "Живая изгородь"
    dxf_layer: GREEN_AI_SHRUBS_GROUP
    default_spacing_m: 0.4
  groundcover:
    ru: "Травянистое покрытие / газон"
    dxf_layer: GREEN_AI_GROUNDCOVER
  flowerbed:
    ru: "Цветник"
    dxf_layer: GREEN_AI_GROUNDCOVER

