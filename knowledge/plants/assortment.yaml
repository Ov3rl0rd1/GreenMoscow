# ---------------------------------------------------------------------------
# ПРАВИЛА ПОДБОРА (таблица решений)
# ---------------------------------------------------------------------------
selection_rules:
  - context: street_carriageway_adjacent
    prefer: [tilia_europaea_pallida, acer_platanoides, acer_rubrum, sorbus_aucuparia, crataegus_pauls_scarlet]
    avoid: [quercus_robur]
    limited: [betula_pendula]
    reason_ru: "Устойчивость к реагентам, загазованности и уплотнению почвы; породы из эталонных уличных проектов пилота."

  - context: narrow_sidewalk
    prefer: [acer_ginnala, sorbus_aucuparia, malus_decorative, crataegus_pauls_scarlet]
    max_crown_d_m: 5.0
    reason_ru: "Остаточная ширина пути для МГН не менее 2,0 м, в стеснённых условиях — 1,2 м с карманами (СП 59.13330.2020, п. 5.1.7)."
    source_ref: sp59_p5_1_7

  - context: residential_windows
    avoid_crown_class: wide
    min_distance_wide_crown_m: 10.0
    reason_ru: "Деревья с широкой кроной, затеняющие жилые помещения, — не ближе 10 м от здания (743-ПП, прим. 3 к табл. 3.6.1)."
    source_ref: ppm743_t3_6_1_note3

  - context: near_heating_network
    rule: "исключить виды, для которых расстояние до оси теплотрассы < heating_min_axis_m"
    prefer_species_without_restriction: [spiraea, physocarpus_opulifolius, symphoricarpos, hydrangea_paniculata, philadelphus]
    reason_ru: >-
      У теплотрасс не следует размещать липу, клён, сирень, жимолость ближе 2 м, а тополь, боярышник,
      кизильник, дёрен, лиственницу, берёзу — ближе 3–4 м; учитывать прогрев почвы 0–2/2–6/6–10 м.
    source_ref: tsn_p4_2_8

  - context: bus_stop
    prefer_crown_class: narrow
    min_distance_from_shelter_side_m: 2.0
    reason_ru: "Деревья с компактной кроной, не ближе 2,0 м от боковых конструкций павильона."
    source_ref: tsn_p4_10_4

  - context: hedge_along_fence
    prefer: [cotoneaster_lucidus, spiraea, physocarpus_opulifolius]
    plant_type: hedge

  - context: noise_protection
    rule: "однорядные/многорядные посадки ≥ 7 м, шаг по кроне 8–10 / 5–6 / 3–4 м, подкроновое пространство — кустарник"
    source_ref: tsn_p4_2_9_2

  - context: under_overhead_line
    max_height_m: 4.0
    prefer: [acer_ginnala, syringa, spiraea]
    reason_ru: "Посадка в охранной зоне ВЛ — только при соблюдении условий согласования (ПП РФ № 160, п. 11 «з»); высота взрослого растения ограничена."
    source_ref: pp160_p11z
