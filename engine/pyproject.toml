[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "greenplan"
version = "0.1.0"
description = "Generative planting design engine with normative setbacks from underground utilities"
requires-python = ">=3.11"
dependencies = [
  "ezdxf>=1.4",
  "shapely>=2.1",
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-image>=0.22",
  "pyyaml>=6.0",
  "pydantic>=2.6",
  "matplotlib>=3.8",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
ml = ["onnxruntime>=1.17"]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6", "httpx>=0.27", "ruff>=0.4"]

[project.scripts]
greenplan = "greenplan.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
  "realdata: requires the extracted pilot dataset under data/pilot",
  "slow: long running tests",
  "converter: requires the LibreDWG dwg2dxf binary",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["greenplan"]
known-local-folder = ["fixtures", "conftest"]
